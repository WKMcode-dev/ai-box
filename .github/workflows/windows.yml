name: Aplicativo Windows
on:
  push:
    tags: ["v*"]
    branches: [main]
    paths: ["desktop/package.json"]
  workflow_dispatch:
    inputs:
      version:
        description: Versão a publicar
        required: true
        default: v1.2.0
permissions:
  contents: write
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
      - name: Resolver versão
        id: version
        shell: pwsh
        env:
          REQUESTED_TAG: ${{ inputs.version }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          $version = (Get-Content desktop/package.json | ConvertFrom-Json).version
          $tag = "v$version"
          if ($env:REQUESTED_TAG -and $env:REQUESTED_TAG -ne $tag) { throw "Versão solicitada difere de desktop/package.json" }
          if ($env:REF_TYPE -eq "tag" -and $env:REF_NAME -ne $tag) { throw "Tag difere da versão do aplicativo" }
          "tag=$tag" >> $env:GITHUB_OUTPUT
      - run: npm ci
      - run: npm test
      - run: npm run dist:desktop
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
      - run: node scripts/verify-static.mjs desktop
      - run: node scripts/verify-windows-release.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: AI-BOX-Windows
          path: |
            desktop/release/*.exe
            desktop/release/*.blockmap
            desktop/release/latest.yml
          if-no-files-found: error
      - name: Publicar versão
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
          RELEASE_COMMIT: ${{ github.sha }}
          GH_REPO: ${{ github.repository }}
        run: |
          $files = Get-ChildItem desktop/release/* -File | Where-Object { $_.Name -match "\.(exe|blockmap)$" -or $_.Name -eq "latest.yml" } | ForEach-Object FullName
          $notes = "docs/releases/$env:RELEASE_TAG.md"
          if (-not (Test-Path $notes)) {
            git fetch origin main --depth=1
            $notesContent = git show "origin/main:$notes" 2>$null
            if ($LASTEXITCODE -ne 0 -or -not $notesContent) { throw "Notas da versão ausentes no commit e na main: $notes" }
            $notesContent | Set-Content -Path $notes -Encoding utf8
          }
          gh release view $env:RELEASE_TAG *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $env:RELEASE_TAG @files --clobber
          } else {
            gh release create $env:RELEASE_TAG @files --target $env:RELEASE_COMMIT --title "A.I BOX $env:RELEASE_TAG — Windows e Web" --notes-file $notes
          }
